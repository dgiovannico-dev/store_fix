# FacilityFlow — produzione (US-E14-01…03)
# Uso: docker compose -f compose.prod.yaml --env-file .env.prod up -d --build
# Lab porte alte: + -f compose.lab.yaml
# Richiede: FF_DOMAIN, AUTH_SECRET, POSTGRES_*, S3_*, SMTP_*, NEXT_PUBLIC_APP_URL
# Limits: top-level cpus/mem_limit (Compose v2 ovunque) = deploy.resources (stessi valori)

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    cpus: 1.0
    mem_limit: 1g
    mem_reservation: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-facilityflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-facilityflow}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    logging: *default-logging
    cpus: 0.5
    mem_limit: 512m
    command: "server -dir=/data -s3 -ip.bind=0.0.0.0 -master.port=9333 -volume.port=8080 -s3.port=8333"
    environment:
      # SigV4 dietro Caddy s3.<FF_DOMAIN> — allinea host firmato dal browser
      WEED_S3_EXTERNAL_URL: ${S3_PUBLIC_ENDPOINT:-}
    volumes:
      - seaweed_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://127.0.0.1:9333/cluster/healthz",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 1g
    mem_reservation: 256m
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-facilityflow}?schema=public
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-facilityflow-attachments}
      S3_FORCE_PATH_STYLE: "true"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-FacilityFlow <noreply@facilityflow.local>}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NTFY_BASE_URL: ${NTFY_BASE_URL:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/health/ready || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 50s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-facilityflow}?schema=public
      NODE_ENV: production
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-FacilityFlow <noreply@facilityflow.local>}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_SECURE: ${IMAP_SECURE:-true}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASS: ${IMAP_PASS:-}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
      IMAP_TENANT_SLUG: ${IMAP_TENANT_SLUG:-}
      IMAP_TENANT_ID: ${IMAP_TENANT_ID:-}
      IMAP_POLL_CRON: ${IMAP_POLL_CRON:-*/2 * * * *}
      IMAP_MARK_SEEN: ${IMAP_MARK_SEEN:-true}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NTFY_BASE_URL: ${NTFY_BASE_URL:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-facilityflow-attachments}
      S3_FORCE_PATH_STYLE: "true"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # F3-02 GlitchTip — docker compose -f compose.prod.yaml --profile observe --env-file .env.prod up -d
  glitchtip-db:
    image: postgres:16-alpine
    profiles: ["observe"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:-glitchtip_change_me}
      POSTGRES_DB: glitchtip
    volumes:
      - glitchtip_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip"]
      interval: 5s
      timeout: 5s
      retries: 10

  glitchtip-valkey:
    image: valkey/valkey:8-alpine
    profiles: ["observe"]
    restart: unless-stopped
    logging: *default-logging

  glitchtip-web:
    image: glitchtip/glitchtip:v5.0.9
    profiles: ["observe"]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      glitchtip-db:
        condition: service_healthy
      glitchtip-valkey:
        condition: service_started
    ports:
      - "127.0.0.1:${GLITCHTIP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD:-glitchtip_change_me}@glitchtip-db:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me-glitchtip-secret}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-https://errors.example.com}
      PORT: "8000"
      REDIS_URL: redis://glitchtip-valkey:6379/0
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-noreply@facilityflow.local}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}

  glitchtip-worker:
    image: glitchtip/glitchtip:v5.0.9
    profiles: ["observe"]
    restart: unless-stopped
    logging: *default-logging
    command: ./bin/run-celery-with-beat.sh
    depends_on:
      glitchtip-db:
        condition: service_healthy
      glitchtip-valkey:
        condition: service_started
    environment:
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD:-glitchtip_change_me}@glitchtip-db:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me-glitchtip-secret}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-https://errors.example.com}
      REDIS_URL: redis://glitchtip-valkey:6379/0
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-noreply@facilityflow.local}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cpus: 0.25
    mem_limit: 128m
    depends_on:
      app:
        condition: service_healthy
    environment:
      FF_DOMAIN: ${FF_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

volumes:
  postgres_data:
  seaweed_data:
  caddy_data:
  caddy_config:
  glitchtip_pg:
