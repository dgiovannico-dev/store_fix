name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

# Same SHA often runs as push(develop) + PR(develop→main lab sync).
# Cancel the duplicate; avoid stacking red noise from superseded runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  # Satisfies PR status when heavy jobs are skipped (lab sync develop→main).
  lab-sync:
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'develop' }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip heavy CI (already green on develop tip)
        run: echo "Lab sync — osv/verify skipped; tip already validated on push to develop."

  osv:
    # Lab sync develop→main: verify already ran on the develop push.
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'develop') }}
    # US-E14-10 / T5.21 — OSV lockfile gate (parallelo a npm audit in verify)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: OSV-Scanner package-lock.json
        run: bash scripts/osv-scan.sh
        env:
          OSV_SCANNER_VERSION: v2.7.0

  verify:
    # Lab sync develop→main: skip re-build (fonts/CI already green on develop tip).
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'develop') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: facilityflow
          POSTGRES_PASSWORD: facilityflow_ci
          POSTGRES_DB: facilityflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U facilityflow -d facilityflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://facilityflow:facilityflow_ci@localhost:5432/facilityflow?schema=public
      AUTH_SECRET: ci-only-not-for-production-use-32chars
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Unit/integration: no Mailpit in CI (mailer usa jsonTransport sotto VITEST)
      SMTP_TRANSPORT: json
      PGBOSS_DISABLED: "true"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Align with Dockerfile base `node:22.23.4-alpine` / `.nvmrc`
          node-version: "22.23.4"
          cache: npm

      - name: Install
        run: npm ci

      - name: Secrets scan
        run: npm run secrets:scan

      - name: Compose prod/lab/observe config
        # S5 / E14 — YAML+env interpolate senza avviare stack (no VPS)
        run: |
          set -euo pipefail
          npm run compose:prod:config
          npm run compose:lab:config
          npm run compose:prod:observe:config

      - name: Caddyfile validate
        # US-E14-01 / T5.4 — sintassi proxy (HSTS site) senza stack up
        run: npm run caddy:validate

      - name: Prisma generate + migrate
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: npm audit (high+)
        run: npm audit --audit-level=high
        # US-E14-10: gate stretto (baseline 0 high+; waiver in docs/ops/AUDIT.md)

      - name: HTTP smoke curl+session (US-E14-12)
        # Auth path su Next start; lifecycle ticket resta su vitest flusso-a
        run: |
          set -euo pipefail
          npm run db:seed:pilot
          PORT=3000 npm run start > /tmp/ff-next.log 2>&1 &
          echo $! > /tmp/ff-next.pid
          for i in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:3000/api/health/live >/dev/null 2>&1; then
              echo "app up after ${i}s"
              break
            fi
            if [[ "$i" -eq 90 ]]; then
              echo "Next failed to become ready" >&2
              tail -n 80 /tmp/ff-next.log >&2 || true
              exit 1
            fi
            sleep 1
          done
          npm run smoke:http
          npm run verify:headers -- http://127.0.0.1:3000/login --prod
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000

      - name: Stop Next after HTTP smoke
        if: always()
        run: |
          if [[ -f /tmp/ff-next.pid ]]; then
            kill "$(cat /tmp/ff-next.pid)" 2>/dev/null || true
          fi

      - name: Perf p95 lista HQ (seed pilota)
        # US-E14-11 — fallisce se p95 ≥ 300 ms (exit 2). Locale: npm run perf:hq-list
        run: npm run db:seed:pilot && npm run perf:hq-list -- pilot-retail 30
