services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-facilityflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facilityflow_dev}
      POSTGRES_DB: ${POSTGRES_DB:-facilityflow}
    # Loopback only — bare "5432:5432" publishes on all interfaces (bypasses UFW).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-facilityflow} -d ${POSTGRES_DB:-facilityflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    command: 'server -dir=/data -s3 -ip.bind=0.0.0.0 -master.port=9333 -volume.port=8080 -s3.port=8333'
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:9333:9333"
    volumes:
      - seaweed_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-facilityflow}:${POSTGRES_PASSWORD:-facilityflow_dev}@postgres:5432/${POSTGRES_DB:-facilityflow}?schema=public
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-change-me}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-admin}
      S3_BUCKET: ${S3_BUCKET:-facilityflow-attachments}
      S3_FORCE_PATH_STYLE: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    profiles: ["full"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-facilityflow}:${POSTGRES_PASSWORD:-facilityflow_dev}@postgres:5432/${POSTGRES_DB:-facilityflow}?schema=public
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: ${SMTP_FROM:-FacilityFlow <noreply@facilityflow.local>}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_SECURE: ${IMAP_SECURE:-true}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASS: ${IMAP_PASS:-}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
      IMAP_TENANT_SLUG: ${IMAP_TENANT_SLUG:-}
      IMAP_TENANT_ID: ${IMAP_TENANT_ID:-}
      IMAP_POLL_CRON: ${IMAP_POLL_CRON:-*/2 * * * *}
      IMAP_MARK_SEEN: ${IMAP_MARK_SEEN:-true}
    profiles: ["full"]

  # Dev-only SMTP catcher — docker compose --profile dev up -d
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["dev", "full"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # F3-02 GlitchTip self-host — docker compose --profile observe up -d
  # DB dedicato (non riusa SoR facilityflow). Zero Sentry Cloud.
  glitchtip-db:
    image: postgres:16-alpine
    profiles: ["observe"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:-glitchtip_dev}
      POSTGRES_DB: glitchtip
    volumes:
      - glitchtip_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip"]
      interval: 5s
      timeout: 5s
      retries: 10

  glitchtip-valkey:
    image: valkey/valkey:8-alpine
    profiles: ["observe"]
    restart: unless-stopped

  glitchtip-web:
    image: glitchtip/glitchtip:v5.0.9
    profiles: ["observe"]
    restart: unless-stopped
    depends_on:
      glitchtip-db:
        condition: service_healthy
      glitchtip-valkey:
        condition: service_started
    ports:
      - "127.0.0.1:${GLITCHTIP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD:-glitchtip_dev}@glitchtip-db:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-dev-only-change-me-glitchtip}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8000}
      PORT: "8000"
      REDIS_URL: redis://glitchtip-valkey:6379/0
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-noreply@facilityflow.local}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}

  glitchtip-worker:
    image: glitchtip/glitchtip:v5.0.9
    profiles: ["observe"]
    restart: unless-stopped
    command: ./bin/run-celery-with-beat.sh
    depends_on:
      glitchtip-db:
        condition: service_healthy
      glitchtip-valkey:
        condition: service_started
    environment:
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD:-glitchtip_dev}@glitchtip-db:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-dev-only-change-me-glitchtip}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8000}
      REDIS_URL: redis://glitchtip-valkey:6379/0
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-noreply@facilityflow.local}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}

volumes:
  postgres_data:
  seaweed_data:
  glitchtip_pg:
