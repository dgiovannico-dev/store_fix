# OpenBao Helm values — standalone VPS / k3s (F4-03).
# Chart: https://github.com/openbao/openbao-helm (repo openbao/openbao)
# Install (operatore):
#   helm repo add openbao https://openbao.github.io/openbao-helm
#   helm upgrade --install openbao openbao/openbao -n openbao --create-namespace \
#     -f deploy/openbao/values-standalone.yaml
# Runbook: docs/ops/VAULT.md

global:
  enabled: true
  tlsDisable: true

server:
  # Single node + file storage — enough for one VPS pilota
  ha:
    enabled: false
  standalone:
    enabled: true
    config: |
      ui = false
      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }
      storage "file" {
        path = "/openbao/data"
      }
  dataStorage:
    enabled: true
    size: 2Gi
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  # Dev mode OFF — real init/unseal on VPS
  dev:
    enabled: false

# Injector / CSI burn RAM on small VPS — use External Secrets instead
injector:
  enabled: false

csi:
  enabled: false

ui:
  enabled: false
