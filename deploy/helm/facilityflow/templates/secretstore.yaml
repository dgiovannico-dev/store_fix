{{- if .Values.vault.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "facilityflow.fullname" . }}-openbao
  labels:
    {{- include "facilityflow.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.vault.server | quote }}
      path: {{ .Values.vault.kvMount | quote }}
      version: "v2"
      auth:
        {{- if eq .Values.vault.auth.method "kubernetes" }}
        kubernetes:
          mountPath: {{ .Values.vault.auth.kubernetes.mountPath | quote }}
          role: {{ .Values.vault.auth.kubernetes.role | quote }}
          serviceAccountRef:
            name: {{ include "facilityflow.fullname" . }}-eso
            {{- with .Values.vault.auth.kubernetes.audiences }}
            audiences:
              {{- toYaml . | nindent 14 }}
            {{- end }}
        {{- else }}
        tokenSecretRef:
          name: {{ .Values.vault.auth.tokenSecretName | quote }}
          key: {{ .Values.vault.auth.tokenSecretKey | quote }}
        {{- end }}
{{- end }}
