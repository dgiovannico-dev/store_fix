{{- if .Values.vault.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "facilityflow.fullname" . }}-runtime
  labels:
    {{- include "facilityflow.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "facilityflow.fullname" . }}-openbao
    kind: SecretStore
  target:
    name: {{ .Values.external.existingSecret }}
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.vault.secretPath | quote }}
        property: DATABASE_URL
    - secretKey: AUTH_SECRET
      remoteRef:
        key: {{ .Values.vault.secretPath | quote }}
        property: AUTH_SECRET
{{- end }}
