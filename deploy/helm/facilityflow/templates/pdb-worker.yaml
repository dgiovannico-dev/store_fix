{{- if and .Values.worker.enabled .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "facilityflow.fullname" . }}-worker
  labels:
    {{- include "facilityflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "facilityflow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
{{- end }}
