{{- if .Values.app.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "facilityflow.fullname" . }}-app
  labels:
    {{- include "facilityflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      {{- include "facilityflow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "facilityflow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: {{ include "facilityflow.image" .Values.app.image }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.app.service.port }}
          env:
            {{- range $k, $v := .Values.app.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.external.existingSecret }}
                  key: {{ .Values.external.databaseUrlSecretKey }}
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.external.existingSecret }}
                  key: AUTH_SECRET
            {{- if .Values.keycloak.enabled }}
            - name: AUTH_OIDC_ENABLED
              value: "1"
            - name: AUTH_CREDENTIALS_ENABLED
              value: {{ ternary "1" "0" .Values.keycloak.credentialsEnabled | quote }}
            - name: AUTH_KEYCLOAK_ID
              value: {{ .Values.keycloak.clientId | quote }}
            {{- with .Values.keycloak.issuer }}
            - name: AUTH_KEYCLOAK_ISSUER
              value: {{ . | quote }}
            {{- end }}
            - name: AUTH_KEYCLOAK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.external.existingSecret }}
                  key: AUTH_KEYCLOAK_SECRET
            {{- end }}
          {{- with .Values.app.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
